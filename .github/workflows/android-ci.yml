name: NEXUS Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-build:
    name: Build, install-smoke-test and package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Run NEXUS core tests
        run: gradle :core:test
      - name: Install and launch NEXUS on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest
      - name: Verify APK package, SDK levels, ABI and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$BUILD_TOOLS_DIR/aapt"
          test -x "$BUILD_TOOLS_DIR/zipalign"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" > /tmp/nexus-apk-badging.txt
          grep -F "package: name='com.mechy007.nexus'" /tmp/nexus-apk-badging.txt
          grep -F "sdkVersion:'26'" /tmp/nexus-apk-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/nexus-apk-badging.txt
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libLive2DCubismCoreJNI.so"

          mkdir -p app/build/distribution
          cp "$APK" app/build/distribution/nexus-debug.apk
          sha256sum app/build/distribution/nexus-debug.apk > app/build/distribution/SHA256SUMS.txt
          cat > app/build/distribution/INSTALL.txt <<'EOF'
          NEXUS Android debug build

          Install nexus-debug.apk, not the downloaded ZIP archive.
          1. Extract the downloaded GitHub Actions artifact ZIP.
          2. Open nexus-debug.apk from the extracted folder.
          3. Allow your file manager/browser to install unknown apps if Android asks.
          4. NEXUS requires Android 8.0 (API 26) or newer.
          5. This build includes the Live2D native runtime for 64-bit ARM Android devices.

          This is a debug build. Its signing key is generated by the CI runner,
          so a later CI build may not install as an in-place update over this one.
          EOF
      - name: Upload installable APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: nexus-installable-apk
          path: app/build/distribution/
          if-no-files-found: error
